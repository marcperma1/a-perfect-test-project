<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#070b24">
  <title>Pac-Man — Mini arcade</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, -apple-system, Segoe UI, sans-serif; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; color: #f5f7ff; background: radial-gradient(ellipse at top, #17204b 0, #090d25 48%, #050716 100%); }
    main { width: min(100%, 650px); text-align: center; }
    h1 { margin: 0 0 4px; color: #ffe229; letter-spacing: .12em; font-size: clamp(2rem, 8vw, 3.2rem); text-shadow: 0 0 18px #ffae00a8; }
    .subtitle { margin: 0 0 16px; color: #b7c2ef; }
    .hud { display: flex; justify-content: space-between; gap: 12px; max-width: 570px; margin: 0 auto 10px; font-weight: 700; }
    .hud span { color: #ffe229; }
    .board { position: relative; width: min(100%, 570px); margin: auto; padding: 8px; border: 2px solid #293b9a; border-radius: 12px; background: #050817; box-shadow: 0 0 32px #1c39b366; }
    canvas { display: block; width: 100%; height: auto; image-rendering: pixelated; }
    .message { min-height: 28px; margin: 12px 0 4px; color: #c9d2fa; }
    button { border: 1px solid #5064d9; border-radius: 9px; padding: 10px 16px; color: #fff; background: #202f86; font: inherit; font-weight: 700; cursor: pointer; touch-action: manipulation; }
    button:hover, button:focus-visible { background: #3045b4; outline: 2px solid #ffe229; outline-offset: 2px; }
    .controls { display: grid; grid-template-columns: repeat(3, 54px); grid-template-rows: repeat(2, 48px); gap: 6px; justify-content: center; margin: 15px auto 0; }
    .controls button { padding: 0; font-size: 1.25rem; }
    .controls [data-dir="up"] { grid-column: 2; grid-row: 1; }
    .controls [data-dir="left"] { grid-column: 1; grid-row: 2; }
    .controls [data-dir="down"] { grid-column: 2; grid-row: 2; }
    .controls [data-dir="right"] { grid-column: 3; grid-row: 2; }
    .help { margin: 14px 0 0; color: #929ecb; font-size: .9rem; }
    @media (min-width: 700px) { .controls { display: none; } }
  </style>
</head>
<body>
  <main>
    <h1>PAC-MAN</h1>
    <p class="subtitle">Une petite chasse aux points dans le labyrinthe !</p>
    <div class="hud" aria-live="polite">
      <div>Score : <span id="score">0</span></div>
      <div>Vies : <span id="lives">3</span></div>
      <div>Record : <span id="best">0</span></div>
    </div>
    <div class="board">
      <canvas id="game" width="570" height="570" aria-label="Jeu Pac-Man. Utilisez les flèches ou WASD pour vous déplacer."></canvas>
    </div>
    <p class="message" id="message" aria-live="polite">Appuie sur une flèche ou sur « Démarrer » pour jouer.</p>
    <button id="restart" type="button">Démarrer / recommencer</button>
    <div class="controls" aria-label="Commandes tactiles">
      <button data-dir="up" aria-label="Haut">▲</button>
      <button data-dir="left" aria-label="Gauche">◀</button>
      <button data-dir="down" aria-label="Bas">▼</button>
      <button data-dir="right" aria-label="Droite">▶</button>
    </div>
    <p class="help">Déplacement : flèches ou WASD · Mange les grosses pastilles pour effrayer les fantômes.</p>
  </main>
  <script>
    (() => {
      const canvas = document.querySelector('#game');
      const ctx = canvas.getContext('2d');
      const scoreEl = document.querySelector('#score');
      const livesEl = document.querySelector('#lives');
      const bestEl = document.querySelector('#best');
      const messageEl = document.querySelector('#message');
      const cols = 19, rows = 19, tile = 30;
      const directions = { up: { x: 0, y: -1 }, down: { x: 0, y: 1 }, left: { x: -1, y: 0 }, right: { x: 1, y: 0 } };
      const colors = ['#ff4a72', '#31e4ff', '#ff9de1', '#ff9b35'];
      let walls, pellets, player, ghosts, score, lives, powerTicks, tick, running, best;
      best = Number(localStorage.getItem('pacman-best') || 0);
      bestEl.textContent = best;

      function makeMaze() {
        const grid = Array.from({ length: rows }, (_, y) => Array.from({ length: cols }, (_, x) => y === 0 || y === rows - 1 || x === 0 || x === cols - 1));
        // Des couloirs réguliers, avec des ouvertures pour garder le labyrinthe connecté.
        for (const y of [4, 8, 12, 16]) for (let x = 1; x < cols - 1; x++) if (![2, 6, 9, 12, 16].includes(x)) grid[y][x] = true;
        for (const x of [4, 8, 12, 16]) for (let y = 1; y < rows - 1; y++) if (![2, 6, 9, 12, 16].includes(y)) grid[y][x] = true;
        // Garder les cases de départ et la petite zone centrale libres.
        for (const [x, y] of [[1,1],[2,1],[1,2],[9,9],[8,9],[10,9],[9,8],[9,10]]) grid[y][x] = false;
        return grid;
      }
      function reset() {
        walls = makeMaze();
        pellets = Array.from({ length: rows }, (_, y) => Array.from({ length: cols }, (_, x) => !walls[y][x] && !(x === 1 && y === 1)));
        // Les grosses pastilles donnent quelques secondes d'avantage.
        pellets[1][17] = 'power'; pellets[17][1] = 'power'; pellets[17][17] = 'power'; pellets[9][9] = false;
        player = { x: 1, y: 1, dir: 'right', next: 'right', mouth: 0 };
        ghosts = [
          { x: 9, y: 9, homeX: 9, homeY: 9, color: colors[0] },
          { x: 8, y: 9, homeX: 8, homeY: 9, color: colors[1] },
          { x: 10, y: 9, homeX: 10, homeY: 9, color: colors[2] },
          { x: 9, y: 10, homeX: 9, homeY: 10, color: colors[3] }
        ];
        score = 0; lives = 3; powerTicks = 0; tick = 0; running = false;
        updateHud(); draw();
        messageEl.textContent = 'Appuie sur une flèche ou sur « Démarrer » pour jouer.';
      }
      function updateHud() { scoreEl.textContent = score; livesEl.textContent = lives; bestEl.textContent = best; }
      function canMove(x, y, dir) { const d = directions[dir]; return !!d && !walls[y + d.y]?.[x + d.x]; }
      function begin() {
        if (!running) {
          // Ne comparer pas le score au nombre de pastilles : les bonus ont des valeurs différentes.
          const mazeCleared = pellets.every(row => row.every(p => !p));
          if (lives <= 0 || mazeCleared) reset();
          running = true;
          messageEl.textContent = 'À toi de jouer !';
        }
      }
      function requestDirection(dir) { player.next = dir; if (!running) begin(); }
      function moveGhost(ghost) {
        const options = Object.keys(directions).filter(d => canMove(ghost.x, ghost.y, d));
        if (!options.length) return;
        const reverse = { up: 'down', down: 'up', left: 'right', right: 'left' }[ghost.dir];
        const choices = options.filter(d => d !== reverse);
        const candidates = choices.length ? choices : options;
        if (powerTicks > 0) {
          ghost.dir = candidates[Math.floor(Math.random() * candidates.length)];
          const d = directions[ghost.dir]; ghost.x += d.x; ghost.y += d.y; return;
        }
        // Choisit un pas qui rapproche du joueur, avec une petite part d'imprévisibilité.
        candidates.sort((a, b) => {
          const da = directions[a], db = directions[b];
          return (Math.abs(ghost.x + da.x - player.x) + Math.abs(ghost.y + da.y - player.y)) - (Math.abs(ghost.x + db.x - player.x) + Math.abs(ghost.y + db.y - player.y));
        });
        ghost.dir = Math.random() < .72 ? candidates[0] : candidates[Math.floor(Math.random() * candidates.length)];
        const d = directions[ghost.dir]; ghost.x += d.x; ghost.y += d.y;
      }
      function loseLife() {
        if (powerTicks > 0) return;
        lives--;
        if (lives <= 0) { running = false; messageEl.textContent = `Partie terminée ! Score : ${score}. Appuie sur recommencer pour rejouer.`; updateHud(); return; }
        player.x = 1; player.y = 1; player.dir = 'right'; player.next = 'right';
        ghosts.forEach(g => { g.x = g.homeX; g.y = g.homeY; });
        powerTicks = 0; messageEl.textContent = 'Oups ! Attention aux fantômes…'; updateHud();
      }
      function step() {
        if (!running) return;
        tick++;
        if (canMove(player.x, player.y, player.next)) player.dir = player.next;
        if (canMove(player.x, player.y, player.dir)) { const d = directions[player.dir]; player.x += d.x; player.y += d.y; }
        player.mouth = (player.mouth + 1) % 2;
        const item = pellets[player.y][player.x];
        if (item) { pellets[player.y][player.x] = false; score += item === 'power' ? 50 : 10; if (item === 'power') powerTicks = 36; }
        if (tick % 2 === 0) ghosts.forEach(moveGhost);
        if (powerTicks > 0) powerTicks--;
        for (const ghost of ghosts) {
          if (ghost.x === player.x && ghost.y === player.y) {
            if (powerTicks > 0) { score += 200; ghost.x = ghost.homeX; ghost.y = ghost.homeY; }
            else { loseLife(); break; }
          }
        }
        if (score > best) { best = score; localStorage.setItem('pacman-best', best); }
        if (pellets.every(row => row.every(p => !p))) { running = false; messageEl.textContent = `Bravo, labyrinthe terminé ! Score : ${score}.`; }
        updateHud(); draw();
      }
      function draw() {
        ctx.fillStyle = '#050817'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        for (let y = 0; y < rows; y++) for (let x = 0; x < cols; x++) {
          const px = x * tile, py = y * tile;
          if (walls[y][x]) { ctx.fillStyle = '#142477'; ctx.fillRect(px + 1, py + 1, tile - 2, tile - 2); ctx.strokeStyle = '#3558e7'; ctx.lineWidth = 2; ctx.strokeRect(px + 3, py + 3, tile - 6, tile - 6); }
          else if (pellets[y][x]) { ctx.beginPath(); ctx.fillStyle = pellets[y][x] === 'power' ? '#fff1a8' : '#f8d7a5'; const r = pellets[y][x] === 'power' ? 6 : 2.4; ctx.arc(px + tile / 2, py + tile / 2, r, 0, Math.PI * 2); ctx.fill(); }
        }
        ghosts.forEach(g => {
          const cx = g.x * tile + tile / 2, cy = g.y * tile + tile / 2;
          ctx.fillStyle = powerTicks > 0 ? (powerTicks < 10 && tick % 2 ? '#f5f5ff' : '#334bd1') : g.color;
          ctx.beginPath(); ctx.arc(cx, cy, 11, Math.PI, 0); ctx.lineTo(cx + 11, cy + 10); ctx.lineTo(cx + 5, cy + 6); ctx.lineTo(cx, cy + 10); ctx.lineTo(cx - 5, cy + 6); ctx.lineTo(cx - 11, cy + 10); ctx.closePath(); ctx.fill();
          if (powerTicks <= 0) { ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx - 4, cy - 1, 3, 0, 7); ctx.arc(cx + 4, cy - 1, 3, 0, 7); ctx.fill(); ctx.fillStyle = '#182052'; ctx.beginPath(); ctx.arc(cx - 3, cy, 1.4, 0, 7); ctx.arc(cx + 5, cy, 1.4, 0, 7); ctx.fill(); }
        });
        const cx = player.x * tile + tile / 2, cy = player.y * tile + tile / 2;
        const angles = { right: 0, down: Math.PI / 2, left: Math.PI, up: -Math.PI / 2 };
        const angle = angles[player.dir] || 0, mouth = player.mouth ? .28 : .08;
        ctx.fillStyle = '#ffe229'; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, 12, angle + mouth, angle + Math.PI * 2 - mouth); ctx.closePath(); ctx.fill();
        if (!running && lives > 0 && score === 0) { ctx.fillStyle = '#ffffff88'; ctx.fillRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = '#101a55'; ctx.font = 'bold 22px system-ui'; ctx.textAlign = 'center'; ctx.fillText('PRÊT ?', canvas.width / 2, canvas.height / 2); }
      }
      document.addEventListener('keydown', e => {
        const map = { ArrowUp: 'up', w: 'up', W: 'up', ArrowDown: 'down', s: 'down', S: 'down', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right' };
        if (map[e.key]) { e.preventDefault(); requestDirection(map[e.key]); }
        if (e.key === ' ' && !running) begin();
      });
      document.querySelectorAll('[data-dir]').forEach(button => {
        button.addEventListener('pointerdown', e => { e.preventDefault(); requestDirection(button.dataset.dir); });
      });
      document.querySelector('#restart').addEventListener('click', () => { reset(); begin(); });
      reset();
      setInterval(step, 145);
    })();
  </script>
</body>
</html>
